internal_sqlite_db_path: "./data/tmp/internal.sqlite"

repo_metadata_cache_path: "./data/tmp/metadata"

audit_dir: "./data/audit"

assessments_dir: "./data/assessments"

cve_list_v5_sub_repo_path: "./submodules/cvelistV5"
deb_sec_tracker_sub_repo_path: "./submodules/debian-security-tracker"

baseline_commit_anchor: "GLVD2-Baseline: true"

glrd_releases_url: "https://gardenlinux-glrd.s3.eu-central-1.amazonaws.com/releases-minor.json"

# CVE relevance screening tunables.
screening:
  # How long we wait until an unresolved CVE (waiting for its Debian triage) is escalated to a human.
  escalation_window: 24h

# Remote and branch used to store our persisted data via git
push:
  remote: "origin"
  branch: "experiment/screening"

# Optional committer identity. Used when both are not empty (!= "").
# Otherwise the default ones from current environment are used.
committer:
  name: "github-actions[bot]"
  email: "41898282+github-actions[bot]@users.noreply.github.com"
