# Vendor/product-pair filter configuration for CPE sources.
#
# Used to filter out specific vendor/product combinations inside our matching logic.
# Neeeded because some combinations are added to CVEs not for the causing component,
# but for affected product. Need seperate rules for the vendor/product-pairs and the
# vendor/product-pairs inside the CPE, because they can use a different format.
#
# Each [[rules]] entry defines a filter rule for a specific vendor (or set of vendors),
# which are called group in the generalizid filter format.
# A combination is discarded if ANY rule matches.
#
# Fields:
#   groups           - list of group names (vendors here) that this rule applies to (matched exactly)
#   discard_all      - if true, discard ALL matches for this group
#   prefix_filters   - discard if product starts with any of these strings
#   contains_filters - discard if product contains any of these strings
#   suffix_filters   - discard if product ends with any of these strings
#   equals           - discard if product matches exactly

[[rules]]
groups = ["ietf"]
equals = ["http", "rfc"]

